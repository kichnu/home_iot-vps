<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Gateway - Login</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <style>
        :root {
            --bg-primary: #0f0a1a;
            --bg-card: #1a1127;
            --bg-card-hover: #241832;
            --bg-input: #2a1e3b;
            --border: #3d2a4f;
            --text-primary: #f5f1f9;
            --text-secondary: #b8a3c8;
            --text-muted: #7a6b8a;
            --accent-amber: #f59e0b;
            --accent-orange: #f97316;
            --accent-yellow: #eab308;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.5;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(249, 115, 22, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(245, 158, 11, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 60px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .login-header {
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-amber));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .logo-icon svg {
            width: 32px;
            height: 32px;
            fill: var(--bg-primary);
        }

        .login-header h1 {
            color: var(--text-primary);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .form-group input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .form-group input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-amber);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        .form-group input[type="password"]::placeholder {
            color: var(--text-muted);
        }

        .login-btn {
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-amber));
            color: var(--bg-primary);
            border: none;
            padding: 14px 28px;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
        }

        .alert.info {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--accent-amber);
        }

        .passkey-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .passkey-divider::before,
        .passkey-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .passkey-divider span {
            padding: 0 12px;
        }

        .passkey-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 14px 28px;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .passkey-btn:hover:not(:disabled) {
            background: var(--bg-card-hover);
            border-color: var(--accent-amber);
        }

        .passkey-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .passkey-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
            padding: 12px 16px;
            margin-top: 16px;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </div>
            <h1>IoT Gateway</h1>
            <p>Administrator Login</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" id="loginForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password webauthn" placeholder="Enter password">
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Login
            </button>
        </form>

        {% if passkeys_available %}
        <div class="passkey-divider">
            <span>or</span>
        </div>

        <button type="button" class="passkey-btn" id="passkeyBtn" onclick="startPasskeyLogin()">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <circle cx="12" cy="16.5" r="1"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Sign in with Passkey
        </button>

        <div class="passkey-error" id="passkeyError" style="display:none;"></div>
        {% endif %}
    </div>

    <script>
        // Reload when restored from bfcache to ensure fresh CSRF token
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            setTimeout(() => {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }, 3000);
        });

        document.addEventListener('DOMContentLoaded', function() {
            {% if passkeys_available %}
            startConditionalPasskey();
            {% endif %}
            document.getElementById('password').focus();
        });

        // WebAuthn / Passkey Login
        const PASSKEY_BTN_HTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><circle cx="12" cy="16.5" r="1"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Sign in with Passkey';
        let conditionalAbort = null;

        async function fetchAuthOptions(conditional) {
            const beginResp = await fetch('/api/webauthn/auth/begin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ conditional: conditional }),
                credentials: 'same-origin'
            });

            if (!beginResp.ok) {
                const err = await beginResp.json();
                throw new Error(err.error || 'Failed to start authentication');
            }

            const beginData = await beginResp.json();
            const options = JSON.parse(beginData.options);

            options.challenge = base64urlToBuffer(options.challenge);
            if (options.allowCredentials) {
                options.allowCredentials = options.allowCredentials.map(function(cred) {
                    return Object.assign({}, cred, { id: base64urlToBuffer(cred.id) });
                });
            }
            return options;
        }

        async function completePasskeyLogin(credential) {
            const authResponse = {
                id: credential.id,
                rawId: bufferToBase64url(credential.rawId),
                response: {
                    authenticatorData: bufferToBase64url(credential.response.authenticatorData),
                    clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
                    signature: bufferToBase64url(credential.response.signature),
                    userHandle: credential.response.userHandle
                        ? bufferToBase64url(credential.response.userHandle)
                        : null
                },
                type: credential.type,
                authenticatorAttachment: credential.authenticatorAttachment || null
            };

            const completeResp = await fetch('/api/webauthn/auth/complete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(authResponse),
                credentials: 'same-origin'
            });

            const completeData = await completeResp.json();

            if (completeResp.ok && completeData.success) {
                window.location.href = completeData.redirect || '/dashboard';
                return true;
            }
            showPasskeyError(completeData.error || 'Authentication failed');
            return false;
        }

        // Conditional UI: passkeys offered in the password field autofill list
        async function startConditionalPasskey() {
            if (!window.PublicKeyCredential || !PublicKeyCredential.isConditionalMediationAvailable) return;
            if (!(await PublicKeyCredential.isConditionalMediationAvailable())) return;

            conditionalAbort = new AbortController();
            const signal = conditionalAbort.signal;
            try {
                const options = await fetchAuthOptions(true);
                if (signal.aborted) return;
                const credential = await navigator.credentials.get({
                    publicKey: options,
                    mediation: 'conditional',
                    signal: signal
                });
                await completePasskeyLogin(credential);
            } catch (error) {
                // Aborted by the passkey button or dismissed by the user - nothing to show
                if (error.name !== 'AbortError' && error.name !== 'NotAllowedError') {
                    console.warn('Conditional passkey login unavailable:', error);
                }
            }
        }

        async function startPasskeyLogin() {
            const btn = document.getElementById('passkeyBtn');
            const errorDiv = document.getElementById('passkeyError');

            // Only one WebAuthn request may be pending at a time
            if (conditionalAbort) {
                conditionalAbort.abort();
                conditionalAbort = null;
            }

            btn.disabled = true;
            btn.textContent = 'Waiting for fingerprint...';
            if (errorDiv) errorDiv.style.display = 'none';

            let redirecting = false;
            try {
                const options = await fetchAuthOptions(false);
                const credential = await navigator.credentials.get({ publicKey: options });
                redirecting = await completePasskeyLogin(credential);
            } catch (error) {
                if (error.name === 'NotAllowedError') {
                    showPasskeyError('Authentication cancelled or timed out.');
                } else if (error.name === 'SecurityError') {
                    showPasskeyError('Security error. Ensure you are using HTTPS.');
                } else {
                    showPasskeyError(error.message || 'Passkey authentication failed');
                }
            } finally {
                btn.disabled = false;
                btn.innerHTML = PASSKEY_BTN_HTML;
                if (!redirecting) startConditionalPasskey();
            }
        }

        function showPasskeyError(message) {
            var errorDiv = document.getElementById('passkeyError');
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
            }
        }

        function base64urlToBuffer(base64url) {
            var base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
            var padding = '='.repeat((4 - base64.length % 4) % 4);
            var binary = atob(base64 + padding);
            var bytes = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function bufferToBase64url(buffer) {
            var bytes = new Uint8Array(buffer);
            var binary = '';
            for (var i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }
    </script>
</body>
</html>
